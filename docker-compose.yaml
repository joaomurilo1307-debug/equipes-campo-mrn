services:
  app:
    image: ghcr.io/joaomurilo1307-debug/equipes-campo-mrn:latest
    pull_policy: always
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      NEXTAUTH_URL: https://${APP_DOMAIN}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      APP_DOMAIN: ${APP_DOMAIN}
      RUN_SEED: ${RUN_SEED}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME}
      SEED_EDITOR_EMAIL: ${SEED_EDITOR_EMAIL}
      SEED_EDITOR_PASSWORD: ${SEED_EDITOR_PASSWORD}
      SEED_EDITOR_NAME: ${SEED_EDITOR_NAME}
      IMPORT_TOKEN: ${IMPORT_TOKEN}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.equipes-campo-mrn.rule=Host(`${APP_DOMAIN}`)"
      - "traefik.http.routers.equipes-campo-mrn.entrypoints=websecure"
      - "traefik.http.routers.equipes-campo-mrn.tls.certresolver=letsencrypt"
      - "traefik.http.services.equipes-campo-mrn.loadbalancer.server.port=3000"

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data

volumes:
  db-data:
